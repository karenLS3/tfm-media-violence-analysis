classification_rules:
  direct_match:
    description: >
      Si aparece un término directo de alta precisión, marcar como candidato fuerte.
    score: 10

  legal_policy_match:
    description: >
      Términos institucionales o legales. Relevantes para contexto, pero pueden aparecer
      en notas de política pública sin caso concreto.
    score: 5

  implicit_phrase_match:
    description: >
      Frases indirectas sobre muerte o desaparición de mujer/joven/chica.
    score: 6

  relation_combo:
    description: >
      Combinación de víctima femenina + muerte/violencia + relación íntima o familiar.
    required_groups:
      - victim_terms.female_victim
      - indirect_terms.generic_crime_terms
      - relationship_terms.intimate_partner
    score: 8

  body_found_combo:
    description: >
      Combinación de cuerpo/cadáver/restos + mujer/joven/chica.
    required_groups:
      - victim_terms.female_victim
      - indirect_terms.victim_death_phrases
    score: 7

  prior_violence_combo:
    description: >
      Señales de violencia previa o denuncia previa en contexto de relación.
    required_groups:
      - relationship_terms.intimate_partner
      - relationship_terms.relational_context
    score: 6

  problematic_framing_match:
    description: >
      No clasifica por sí solo. Sirve para análisis discursivo del tratamiento mediático.
    score: 2

thresholds:
  strong_candidate: 8
  weak_candidate: 5
  review_candidate: 3